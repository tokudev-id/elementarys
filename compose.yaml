services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: school_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - test_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_test"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  test_pg:
